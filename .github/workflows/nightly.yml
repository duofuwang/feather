name: Nightly

on:
  schedule:
    # nightly build cron
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Upstream ref to build (empty = upstream main)'
        required: false
        default: ''
      force:
        description: 'Build even when nothing changed'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nightly
          fetch-depth: 0

      - name: Sync nightly from upstream
        id: detect
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/claration/feather.git
          git fetch upstream main --tags

          if [ -n "${{ github.event.inputs.source }}" ]; then
            REF="${{ github.event.inputs.source }}"
          else
            REF=FETCH_HEAD
          fi

          echo "syncing to $REF (upstream/main by default)"

          # Remember the current nightly tip before reset --hard moves HEAD.
          PREV_HEAD=$(git rev-parse HEAD)
          TARGET=$(git rev-parse "${REF}^{commit}" 2>/dev/null || echo "$REF")
          FORCE="${{ github.event.inputs.force }}"

          git reset --hard "$REF"
          git checkout "${{ github.sha }}" -- .github/
          git add -A

          # Compare the tree we are about to commit against the current nightly
          # tree. If upstream sources and our .github/ are both unchanged there
          # is nothing new to compile, so skip the macOS build entirely.
          # Comparing trees (not HEAD^) stays correct even when extra commits,
          # like workflow edits, are pushed onto the nightly branch.
          NEW_TREE=$(git write-tree)
          OLD_TREE=$(git rev-parse "${PREV_HEAD}^{tree}")
          if [ "$FORCE" != "true" ] && [ "$NEW_TREE" = "$OLD_TREE" ]; then
            echo "unchanged at $TARGET (tree $NEW_TREE); skipping sync and build"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true (target=$TARGET, tree $OLD_TREE -> $NEW_TREE, force=${FORCE:-false})"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          git commit -m "chore: sync nightly with upstream $REF ($(date -u +%Y-%m-%d))" --allow-empty
          git push --force origin nightly

  build:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: nightly
          submodules: 'true'

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.3.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          xcodebuild -version

      - name: Expose entitlements editor
        run: |
          python3 - <<'PY'
          import pathlib

          targets = [
              "Feather/Views/Signing/SigningView.swift",
              "Feather/Views/Signing/BulkSigningView.swift",
          ]

          for name in targets:
              path = pathlib.Path(name)
              if not path.exists():
                  print(f"skip {name} (not present)")
                  continue
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              out = []
              i = 0
              removed = 0
              while i < len(lines):
                  if lines[i].strip() == "#if NIGHTLY || DEBUG":
                      j = i + 1
                      while j < len(lines) and lines[j].strip() != "#endif":
                          j += 1
                      block = "".join(lines[i + 1:j])
                      if "SigningEntitlementsView" in block:
                          out.extend(lines[i + 1:j])
                          i = j + 1
                          removed += 1
                          continue
                  out.append(lines[i])
                  i += 1
              path.write_text("".join(out), encoding="utf-8")
              print(f"{name}: removed {removed} guard(s)")
          PY

      - name: Repair stale package resolution
        run: |
          # Upstream keeps two Package.resolved files. The one under
          # Feather.xcodeproj/ has not been updated since 2025-05 and still
          # pins packages (LicensePlist, XcodeEdit, Yams, APIKit, ...) that
          # were removed from the project file. `make` builds with
          # -project Feather.xcodeproj, so Xcode reads that stale copy and
          # SwiftPM crashes in Resolve Package Graph with:
          #   -[NSMutableArray insertObjects:atIndexes:]: count of array (32)
          #   differs from count of index set (31)
          # The workspace copy is current, so mirror it into the project.
          SRC="Feather.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          DST="Feather.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DST"
            python3 -c "import json;print('project pins:', len(json.load(open('$DST'))['pins']))"
          else
            echo "workspace resolved file missing; removing stale project copy"
            rm -f "$DST"
          fi

      - name: Compile Feather
        run: |
          agvtool new-version -all $(git rev-parse HEAD)
          if ! make iphoneos; then
            echo "first attempt failed; retrying with a freshly generated package graph"
            rm -f Feather.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
            rm -rf "${TMPDIR:-/tmp}/Feather/iphoneos"
            make iphoneos
          fi
          mkdir -p upload
          mv packages/* upload/

      - name: Resolve release tag
        id: tag
        run: |
          VER=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" _build/Payload/Feather.app/Info.plist)
          MAX=$(git ls-remote --tags origin "v${VER}-*" \
            | sed 's#.*refs/tags/##' \
            | sed "s#^v${VER}-##" \
            | grep -E '^[0-9]+$' | sort -n | tail -1)
          N=$(( ${MAX:-0} + 1 ))
          echo "tag=v${VER}-${N}" >> $GITHUB_OUTPUT
          echo "resolved: v${VER}-${N} (previous max: ${MAX:-none})"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feather-nightly-ipa
          path: upload/*
          if-no-files-found: error

      - name: Publish nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Feather ${{ steps.tag.outputs.tag }}
          prerelease: false
          files: |
            upload/*
          fail_on_unmatched_files: true
          draft: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
