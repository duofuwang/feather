name: Release

on:
  push:
    tags:
      - v*
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_26.3.0.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.3.0.app
          else
            sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          xcodebuild -version

      - name: Compile Feather
        run: |
          agvtool new-version -all $(git rev-parse HEAD)
          make iphoneos
          mkdir -p upload
          mv packages/* upload/

      - name: Extract Version
        id: get_version
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" _build/Payload/Feather.app/Info.plist)
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Feather-ipa
          path: upload/*
          if-no-files-found: error

      - name: Resolve release target
        id: rel
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "tag=nightly" >> $GITHUB_OUTPUT
            echo "name=Feather nightly $(date -u +%Y-%m-%d)" >> $GITHUB_OUTPUT
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "name=Feather ${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          name: ${{ steps.rel.outputs.name }}
          prerelease: ${{ steps.rel.outputs.prerelease == 'true' }}
          files: |
            upload/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
